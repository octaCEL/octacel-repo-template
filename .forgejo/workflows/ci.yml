name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  template_validation:
    if: github.repository == 'octaCEL/octacel-repo-template'
    runs-on: octacel-org-ci
    container: docker.io/library/node:24-trixie-slim@sha256:54f84b4cf8432b21aaffd5d3ce8d41e12cea0d10d33c09d2f3c9879d49d6b446
    timeout-minutes: 15
    steps:
      - name: Install pinned checkout prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends ca-certificates git=1:2.47.3-0+deb13u1 python3=3.13.5-1
      - name: Check out template
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the template bootstrap and tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests
          bash -n scripts/init-project.sh
          git diff --check

  project:
    if: github.repository != 'octaCEL/octacel-repo-template'
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/validate-project.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c

  node_quality:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template' && (needs.project.outputs.project_type == 'nextjs' || needs.project.outputs.project_type == 'node-backend' || needs.project.outputs.project_type == 'typescript-library' || needs.project.outputs.project_type == 'browser-extension' || needs.project.outputs.project_type == 'containerized-backend' || needs.project.outputs.project_type == 'saas' || needs.project.outputs.project_type == 'supabase-postgres')
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/node-quality.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
      node_version: ${{ needs.project.outputs.node_version }}
      integration_enabled: ${{ needs.project.outputs.integration_enabled }}

  postgres:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template' && needs.project.outputs.project_type == 'supabase-postgres'
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/supabase-pgtap.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
      node_version: ${{ needs.project.outputs.node_version }}

  terraform:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template' && (needs.project.outputs.project_type == 'terraform-infrastructure' || needs.project.outputs.project_type == 'terraform-module')
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/terraform-validate.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
      terraform_version: ${{ needs.project.outputs.terraform_version }}
      terraform_root: ${{ needs.project.outputs.terraform_root }}

  iac:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template' && (needs.project.outputs.project_type == 'terraform-infrastructure' || needs.project.outputs.project_type == 'terraform-module')
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/iac-scan.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
      terraform_root: ${{ needs.project.outputs.terraform_root }}

  security:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template'
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/security-scan.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c

  machine:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template'
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/machine-compatibility.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c

  release:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template'
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/release-validation.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
      project_type: ${{ needs.project.outputs.project_type }}

  container_build:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template' && needs.project.outputs.container_enabled == 'true'
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/container-build.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c

  systemd:
    needs: project
    if: github.repository != 'octaCEL/octacel-repo-template' && (needs.project.outputs.project_type == 'terraform-infrastructure' || needs.project.outputs.container_enabled == 'true')
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/systemd-validation.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c

  summary:
    needs: [project, node_quality, postgres, terraform, iac, security, machine, release, container_build, systemd]
    if: github.repository != 'octaCEL/octacel-repo-template' && always()
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/summary.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
      expected_workflows_json: ${{ needs.project.outputs.expected_workflows_json }}
      needs_json: ${{ toJSON(needs) }}

  publish:
    needs: [project, container_build, summary]
    if: github.repository != 'octaCEL/octacel-repo-template' && always() && needs.summary.result == 'success' && needs.project.outputs.container_enabled == 'true' && needs.container_build.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ahmed.al-zanam/octacel-ci/.forgejo/workflows/image-publish.yml@b17fc88705e56b271cff9814ca91e60ae28ba81c
    with:
      framework_ref: b17fc88705e56b271cff9814ca91e60ae28ba81c
